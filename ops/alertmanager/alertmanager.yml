global:
  resolve_timeout: 1m

route:
  # Alerts remain visible in Alertmanager and Prometheus for the local MLOps
  # demonstration. Deployment automation is handled by GitHub Actions.
  receiver: "discard"
  group_by: ["alertname", "model_version"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: "discard"
