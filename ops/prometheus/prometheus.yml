global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "backend-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend-api:8000"]

  - job_name: "feedback-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["feedback-service:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
