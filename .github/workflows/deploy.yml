name: Deploy to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'triageiq' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'prod' }}
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build the initial model artifact for this release
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python scripts/prepare_data.py
          python scripts/train_initial.py
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish runtime secrets as SecureString parameters
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GATEWAY_HTPASSWD: ${{ secrets.GATEWAY_HTPASSWD }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          prefix="/${PROJECT_NAME}/${ENVIRONMENT}"
          aws ssm put-parameter --name "${prefix}/postgres-password" --type SecureString --value "$POSTGRES_PASSWORD" --overwrite
          aws ssm put-parameter --name "${prefix}/gateway-htpasswd" --type SecureString --value "$GATEWAY_HTPASSWD" --overwrite
          aws ssm put-parameter --name "${prefix}/smoke-password" --type SecureString --value "$SMOKE_PASSWORD" --overwrite
      - name: Resolve Terraform-managed resources
        id: resources
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="${PROJECT_NAME}-${ENVIRONMENT}-${account_id}-${AWS_REGION}"
          instance_id="$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=${PROJECT_NAME}" "Name=tag:Environment,Values=${ENVIRONMENT}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          distribution_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${PROJECT_NAME}-${ENVIRONMENT} frontend and API edge'].Id | [0]" --output text)"
          test -n "$instance_id" && test "$instance_id" != "None"
          test -n "$distribution_id" && test "$distribution_id" != "None"
          printf 'bucket=%s\ninstance_id=%s\ndistribution_id=%s\n' "$bucket" "$instance_id" "$distribution_id" >> "$GITHUB_OUTPUT"
      - name: Deploy the static frontend to private S3
        run: |
          aws s3 sync services/gateway/frontend/ "s3://${{ steps.resources.outputs.bucket }}/" --delete --exclude 'releases/*'
          aws cloudfront create-invalidation --distribution-id "${{ steps.resources.outputs.distribution_id }}" --paths '/*'
      - name: Package and upload the backend release
        run: |
          tar --exclude-vcs --exclude='.venv' --exclude='mlruns' --exclude='data/feedback' -czf "/tmp/triageiq-${RELEASE_SHA}.tgz" .
          aws s3 cp "/tmp/triageiq-${RELEASE_SHA}.tgz" "s3://${{ steps.resources.outputs.bucket }}/releases/${RELEASE_SHA}.tgz"
      - name: Deploy the approved revision through Systems Manager
        run: |
          set -euo pipefail
          release_dir="/opt/triageiq/releases/${RELEASE_SHA}"
          cat > /tmp/ssm-parameters.json <<EOF
          {"commands":[
            "set -euo pipefail",
            "mkdir -p ${release_dir}",
            "aws s3 cp s3://${{ steps.resources.outputs.bucket }}/releases/${RELEASE_SHA}.tgz /tmp/triageiq-release.tgz",
            "tar -xzf /tmp/triageiq-release.tgz -C ${release_dir}",
            "PROJECT_NAME=${PROJECT_NAME} ENVIRONMENT=${ENVIRONMENT} bash ${release_dir}/deploy/ec2/deploy.sh ${release_dir}"
          ]}
          EOF
          command_id="$(aws ssm send-command \
            --instance-ids "${{ steps.resources.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${RELEASE_SHA}" \
            --parameters file:///tmp/ssm-parameters.json \
            --query Command.CommandId --output text)"
          if ! aws ssm wait command-executed --command-id "$command_id" --instance-id "${{ steps.resources.outputs.instance_id }}"; then
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ steps.resources.outputs.instance_id }}" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ steps.resources.outputs.instance_id }}" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
