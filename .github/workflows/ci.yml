name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint authored Python
        run: ruff check ml services scripts
      - name: Run ML tests
        run: python -m pytest ml/tests
      - name: Validate Docker Compose syntax
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build gateway backend-api feedback-service model-service ticket-generator postgres

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependency and SAST scanners
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Scan Python source for unsafe patterns
        run: bandit -r ml services scripts -x "*/tests/*" -ll
      - name: Scan repository and Dockerfiles for vulnerabilities
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
