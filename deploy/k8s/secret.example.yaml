# Copy this file to .env.k8s or create the Secret with kubectl. Do not commit a
# real htpasswd value. The gateway requires an Apache htpasswd-formatted hash.
apiVersion: v1
kind: Secret
metadata:
  name: triageiq-gateway-credentials
  namespace: triageiq-demo
type: Opaque
stringData:
  GATEWAY_HTPASSWD: "replace-with-an-htpasswd-hash"
